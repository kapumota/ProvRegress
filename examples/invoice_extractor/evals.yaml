suite: invoice-json-extractor
app_type: json_extractor
version: 0.3.0
providers:
  baseline:
    model: gpt-4.1-mini
    prompt: prompts/v1.txt
    provider: mock
  candidate:
    model: gpt-4.1-mini
    prompt: prompts/v2.txt
    provider: mock
tests:
  - id: invoice-001
    input: "Extrae JSON de esta factura: Proveedor ACME, número INV-001, total 125.50 USD."
    metadata:
      mock_output: '{"vendor":"ACME","invoice_number":"INV-001","total":125.50}'
      mock_latency_ms: 80
    assertions:
      - type: json_valid
        severity: critical
      - type: json_schema
        severity: critical
        schema: schemas/invoice.schema.json
      - type: regex
        pattern: '"invoice_number"\s*:\s*"INV-[0-9]+"'
        severity: high
      - type: max_latency_ms
        value: 5000
        severity: medium
  - id: invoice-002
    input: "Extrae JSON de esta factura: Proveedor Beta, número INV-002, total 75.00 USD."
    metadata:
      mock_output: '{"vendor":"Beta","invoice_number":"INV-002","total":75.00}'
      mock_latency_ms: 70
    assertions:
      - type: json_valid
        severity: critical
      - type: json_schema
        severity: critical
        schema:
          type: object
          required: ["vendor", "invoice_number", "total"]
          properties:
            vendor:
              type: string
            invoice_number:
              type: string
            total:
              type: number
