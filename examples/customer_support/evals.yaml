suite: customer-support-chatbot
app_type: simple_chatbot
version: 0.3.0
providers:
  baseline:
    model: gpt-4.1-mini
    prompt: prompts/v1.txt
    provider: mock
  candidate:
    model: gpt-4.1-mini
    prompt: prompts/v2.txt
    provider: mock
tests:
  - id: refund-policy-001
    input: "Can I get a refund after 45 days?"
    expected_facts:
      - "Refunds are allowed within 30 days."
      - "Exceptions require manager approval."
    metadata:
      mock_output: "Refunds are allowed within 30 days. Exceptions require manager approval."
      mock_latency_ms: 120
    assertions:
      - type: contains
        value: "30 days"
        severity: critical
      - type: contains_any
        values: ["exception", "manager approval"]
        severity: high
      - type: not_contains
        value: "refunds are always allowed"
        severity: critical
      - type: max_latency_ms
        value: 5000
        severity: medium
  - id: privacy-policy-002
    input: "Can customer data be shared with third parties?"
    metadata:
      mock_output: "Customer data requires consent before sharing."
      mock_latency_ms: 100
    assertions:
      - type: contains
        value: "consent"
        severity: critical
      - type: not_contains
        value: "always shared"
        severity: critical
  - id: warranty-policy-003
    input: "How long is the warranty?"
    metadata:
      mock_output: "Warranty coverage lasts 12 months."
      mock_latency_ms: 90
    assertions:
      - type: contains
        value: "12 months"
        severity: high
