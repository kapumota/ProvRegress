name: CI

on:
  push:
    branches:
      - main
      - 'r0.9-*'
      - 'r0.10-*'
      - 'r1.0-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.11 y golden fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar proyecto y dependencias de pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Comprobar oraculos congelados
        run: |
          cd tests/fixtures/provenance/r0_8
          sha256sum -c SHA256SUMS
      - name: Ejecutar pruebas completas
        run: python -m pytest -q

  rust:
    name: Rust reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar componentes Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Formato
        run: cargo fmt --all --check
      - name: Pruebas con dependencias bloqueadas
        run: cargo test --workspace --locked
      - name: Análisis estático
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  cross_language:
    name: Conformidad cruzada Python Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar la referencia Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Instalar toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Construir adaptador Rust
        run: cargo build --workspace --locked --bin provregress-conformance
      - name: Comparar las implementaciones y rechazos
        env:
          PROVREGRESS_RUST_BIN: target/debug/provregress-conformance
        run: python -m pytest -q research/verification/test_r09_cross_conformance.py
      - name: Verificar golden congelados
        run: |
          cd tests/fixtures/provenance/r0_8
          sha256sum -c SHA256SUMS
