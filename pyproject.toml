[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtestlab"
version = "0.3.0"
description = "Fase 3 de LLMTestLab: CLI básico con assertions determinísticas para suites evals.yaml."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "LLMTestLab Team" }
]
dependencies = [
  "PyYAML>=6.0.0",
  "pydantic>=2.0.0",
  "jsonschema>=4.22.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
llmtestlab = "llmtestlab.cli:app"

[tool.setuptools.packages.find]
include = ["llmtestlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
