[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provregress"
version = "0.3.0"
description = "Version-differential provenance and regression attribution for evolving AI systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.0",
  "pydantic>=2.0.0",
  "jsonschema>=4.22.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
llmtestlab = "llmtestlab.cli:app"

[tool.setuptools.packages.find]
include = [
  "provregress*",
  "llmtestlab*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
