[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtestlab"
version = "0.1.0"
description = "Fase 1 de LLMTestLab: diseño e implementación del formato evals.yaml."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "LLMTestLab Team" }
]
dependencies = [
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
llmtestlab = "llmtestlab.cli:main"

[tool.setuptools.packages.find]
include = ["llmtestlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
