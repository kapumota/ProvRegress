[package]
name = "provregress-reference"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Referencia Rust de los contratos P2/P3 de ProvRegress"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
